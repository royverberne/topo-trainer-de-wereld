    <div class="brand"><img class="emb" alt="" src="emblem.webp"><span class="t"><span class="n">Topo Trainer: De Wereld</span><span class="by">Leer de wereld kennen!</span></span></div>
    <nav class="modes" id="modes" aria-label="Leermodus">
      <button data-mode="verkennen" aria-pressed="true">Verkennen</button>
      <button data-mode="oefenen" aria-pressed="false">Oefenen</button>

    </nav>
    <nav class="modes views" id="views" aria-label="Kaartweergave">
      <button data-view="globe" aria-pressed="true"><span class="long">3D-bol</span><span class="short">3D</span></button>

  <main class="stage" id="stage">
    <canvas id="globe" aria-label="Wereldbol. Sleep om te draaien, knijp of scroll om te zoomen."></canvas>
    <div class="card prompt" id="prompt" hidden></div>
    <div class="card info" id="info" hidden></div>
    <div class="card center" id="center" hidden></div>
    <div class="zoom">
      <button id="zin" aria-label="Inzoomen">+</button>
      <button id="zout" aria-label="Uitzoomen">&minus;</button>
      <button id="zhome" aria-label="Terug naar beginpositie"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg></button>
    </div>
    <div class="toast" id="toast" hidden></div>
  </main>
  <footer class="foot"><div><b>Meester Roy</b> &middot; Topo Trainer: De Wereld</div><span>Leren met plezier, stap voor stap</span></footer>
